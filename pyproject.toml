[project]
name = "security-public-transport"
version = "0.1.0"
description = "Crime prediction in public transport CDMX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=1.0.1",
    "geopy>=2.4.1",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "plotly>=5.22.0",
    "duckdb>=1.0.0",
    "scikit-learn>=1.4.2",
    "shapely>=2.0.4",
    "streamlit>=1.35.0",
    "streamlit-plotly-events>=0.0.6",
    "streamlit-folium>=0.21.0",
    "python-dotenv>=1.0.1",
    "streamlit-analytics2>=0.8.1",
    "flask>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]
